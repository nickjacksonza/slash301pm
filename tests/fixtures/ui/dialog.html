<div data-signals="{&quot;confirm_delete&quot;:{&quot;open&quot;:false}}">

    <div aria-modal="true" class="data-[state=closed]:animate-out data-[state=closed]:fade-out-0 data-[state=closed]:zoom-out-95 data-[state=open]:animate-in data-[state=open]:fade-in-0 data-[state=open]:zoom-in-95 fixed left-[50%] max-w-lg top-[50%] translate-x-[-50%] translate-y-[-50%] w-full z-50" data-on:click="evt.stopPropagation()" data-on:mount="evt.target.focus()" id="confirm-delete" role="dialog" tabindex="-1">

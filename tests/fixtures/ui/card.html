<div class="bg-card border flex flex-col gap-6 py-6 rounded-xl shadow-sm text-card-foreground" data-slot="card">

    <div class="font-semibold leading-none" data-slot="card-title">
      Project
    </div>
    <div class="text-muted-foreground text-sm" data-slot="card-description">
      Details

      Act
    </div>

    Body
  </div>
  <div class="[.border-t]:pt-6 flex items-center px-6" data-slot="card-footer">
    Footer
  </div>
